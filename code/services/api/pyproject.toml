[project]
name = "oslo-api"
version = "0.1.0"
description = "OSLO Product Grill application API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "email-validator>=2.3,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1",
  "langgraph>=0.6,<1",
  "openai>=1.100,<2",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pypdf>=6.0,<7",
  "pypdfium2>=5,<6",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "rapidocr-onnxruntime>=1.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oslo_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
