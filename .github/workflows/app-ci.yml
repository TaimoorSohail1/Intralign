# OSLO Release 1 — Application CI (DTM-0001; Phase I).
#
# Implements the Deployment Governance §4 gate sequence for the app under code/
# (monorepo override, ADR-0001). Gate semantics + ordering follow the starter-kit
# template (30_engineering/delivery/starter_kit/ci-pipeline.yml); any gate failure
# stops the run (steps run in order; first non-zero exit fails the job).
# Gate logic lives in unit-testable scripts under code/ci/ (see code/ci/README.md,
# incl. the per-gate forced-failure procedure).
#
# Gate 7 (human review) is enforced by GitHub branch protection on `main`
# (required reviewer = owner), NOT by this workflow. Keep branch protection ON.
# Gate 8 (promote) is out of Phase I scope (Deployment Governance §4.8).
#
# Does not touch doc-integrity.yml (knowledge-base docs gate).

name: app-ci

on:
  pull_request:
    branches: [main]
    paths: ["code/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["code/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  app-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks (gate 6) scans commit history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Gate 1: Build (ratified stack) ---
      - name: "Gate 1 — build backend (pip install + ruff)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .

      - name: "Gate 1 — build frontend (npm ci + tsc/vite)"
        working-directory: code/frontend
        run: |
          npm ci
          npm run build

      # --- Gate 2: Contract-traceability (HARD GATE) ---
      # PR body must cite an approved IC-* contract id; label `phase-1-infra`
      # bypasses until Phase I closes (decision #3). PR body/labels are passed
      # via env (never interpolated into the shell). Push events to main carry
      # no PR context: the gate already ran on the PR; merge is gate-7 protected.
      - name: "Gate 2 — contract-traceability"
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python -m ci.gate_contract

      # --- Gate 3: Tests (positive AND negative) ---
      # Suites run separately so an empty or absent suite fails on its own:
      # pytest exits 5 on zero collected tests and 4 on a missing path — both
      # non-zero. A suite without negatives is invalid (QA Governance).
      - name: "Gate 3 — positive suite"
        run: python -m pytest tests/positive

      - name: "Gate 3 — negative suite"
        run: python -m pytest tests/negative

      # --- Gate 4: Epistemic-invariant gate (HARD GATE, Critical) ---
      # Forbidden-token scan (allowlist: ci/invariant_allowlist.txt), no
      # backend/**/authority dir, canonical-table migration linter (DL-043).
      - name: "Gate 4 — epistemic-invariant gate"
        run: python -m ci.gate_invariants

      # --- Gate 5: Observability (REAL — DTM-0006, OBS-WA-00R) ---
      # Static checks: every CHR-append call-site emits
      # cognition_history_record_appended (a governed emission without its
      # event fails the build, DL-054 cond.1); the A6 vocabulary is pinned
      # verbatim in events.py; the two-axis replay harness exists. Then the
      # replay suite runs (its live axes skip without a local Supabase stack;
      # the pure tamper-detection axes always run — an empty/missing suite
      # fails via pytest exit 4/5).
      - name: "Gate 5 — observability (governed-output events + two-axis replay)"
        run: |
          python -m ci.gate_observability
          python -m pytest tests/replay

      # --- Gate 6: Security (secret-scan + dependency audits; findings FAIL) ---
      - name: "Gate 6 — secret scan (gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Gate 6 — pip-audit (production deps)"
        # Audits [project.dependencies] from pyproject.toml (production scope).
        run: pipx run pip-audit .

      - name: "Gate 6 — npm audit (production deps, high+)"
        working-directory: code/frontend
        run: npm audit --omit=dev --audit-level=high

      # --- Gate 7: Human review — branch protection on `main`, not this file ---
      # --- Gate 8: Promote — out of Phase I scope ---
