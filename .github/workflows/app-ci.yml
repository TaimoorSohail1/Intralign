name: OSLO application quality gates

on:
  pull_request:
    branches: [main]
    paths: ["code/**", "release-2/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["code/**", "release-2/**", ".github/workflows/app-ci.yml"]

concurrency:
  group: oslo-app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: code

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANALYSIS_HARNESS: deterministic
      ANALYSIS_PHASE_DELAY_MS: 0
      EXTENDED_ANALYSIS_DELAY_MS: 0
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55322/postgres
      SUPABASE_URL: http://127.0.0.1:55321
      WEB_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 55325
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      OSLO_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Gate 1 — install application dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Gate 2 — approved-contract traceability
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if ! grep -Eq 'IC-[A-Z0-9-]+' <<<"$PR_BODY"; then
            echo "PR body must cite at least one approved IC-* contract."
            exit 1
          fi

      - name: Start local Supabase
        run: pnpm supabase start

      - name: Export local Supabase credentials
        shell: bash
        run: |
          status="$(pnpm exec supabase status -o json)"
          echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<<"$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")" >> "$GITHUB_ENV"

      - name: Seed local platform
        run: pnpm seed:local

      - name: Gate 2b — R2 doctrine-guardrail contract
        run: pnpm test:r2-guardrails

      - name: Gate 3 — API and web quality
        run: |
          pnpm lint:api
          pnpm lint:web
          pnpm test:api
          pnpm test:web
          pnpm build:web

      - name: Start application
        shell: bash
        run: |
          uv run --project services/api uvicorn oslo_api.main:app --host 127.0.0.1 --port 8000 > /tmp/oslo-api.log 2>&1 &
          echo $! > /tmp/oslo-api.pid
          pnpm --filter @oslo/web start > /tmp/oslo-web.log 2>&1 &
          echo $! > /tmp/oslo-web.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/login >/dev/null \
              && exit 0
            sleep 2
          done
          cat /tmp/oslo-api.log /tmp/oslo-web.log
          exit 1

      - name: Gate 4 — end-to-end slices
        run: pnpm test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            code/tests/e2e/test-results
            code/tests/e2e/playwright-report
          if-no-files-found: ignore

      - name: Stop local platform
        if: always()
        shell: bash
        run: |
          for pid_file in /tmp/oslo-api.pid /tmp/oslo-web.pid; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          pnpm supabase stop
