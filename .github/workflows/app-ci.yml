name: OSLO application quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: oslo-app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The complete 84-case Playwright matrix runs serially against shared seeded
    # database state across desktop, tablet, and mobile.
    timeout-minutes: 90
    env:
      ANALYSIS_HARNESS: deterministic
      ANALYSIS_PHASE_DELAY_MS: 0
      EXTENDED_ANALYSIS_DELAY_MS: 0
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55322/postgres
      SUPABASE_URL: http://127.0.0.1:55321
      WEB_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 55325
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      OSLO_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # RB-056: required checks report on every PR. Expensive gates run only
      # when the consolidated application tree changed.
      - name: Determine application-CI applicability
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          app_ci_applies() {
            has_app_tree="$1"
            changed_paths="$2"
            [ "$has_app_tree" = "true" ] && grep -Eq '^apps/intralign/' <<<"$changed_paths"
          }

          if app_ci_applies true '00_owner/framework.md'; then
            echo "::error::RB-056 self-test failed: docs-only input selected application CI."
            exit 1
          fi
          if ! app_ci_applies true 'apps/intralign/services/api/example.py'; then
            echo "::error::RB-056 self-test failed: application input skipped application CI."
            exit 1
          fi
          if app_ci_applies false 'apps/intralign/services/api/example.py'; then
            echo "::error::RB-056 self-test failed: absent application tree selected application CI."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git show --format= --name-only HEAD)"
          else
            CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          fi

          if [ ! -d apps/intralign ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no consolidated application tree on this ref" >> "$GITHUB_OUTPUT"
          elif app_ci_applies true "$CHANGED"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=consolidated application changed" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no consolidated application change" >> "$GITHUB_OUTPUT"
          fi

      - name: SKIP-OK — application CI does not apply
        if: steps.scope.outputs.run != 'true'
        run: echo "SKIP-OK — ${{ steps.scope.outputs.reason }}."

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.run == 'true'
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/intralign/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v6
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Gate 1 — install application dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Gate 2 — approved-contract traceability
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        working-directory: apps/intralign
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if ! grep -Eq 'IC-[A-Z0-9-]+' <<<"$PR_BODY"; then
            echo "PR body must cite at least one approved IC-* contract."
            exit 1
          fi

      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        run: pnpm supabase start

      - name: Export local Supabase credentials
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        shell: bash
        run: |
          status="$(pnpm exec supabase status -o json)"
          echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<<"$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")" >> "$GITHUB_ENV"

      - name: Seed local platform
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        run: pnpm seed:local

      - name: Gate 2b — R2 doctrine guardrails
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        run: pnpm test:r2-guardrails

      - name: Gate 3 — API and web quality
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        run: |
          pnpm lint:api
          pnpm lint:web
          pnpm test:api
          pnpm test:web
          pnpm build:web

      - name: Start application
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        shell: bash
        run: |
          uv run --project services/api uvicorn oslo_api.main:app --host 127.0.0.1 --port 8000 > /tmp/oslo-api.log 2>&1 &
          echo $! > /tmp/oslo-api.pid
          pnpm --filter @oslo/web start > /tmp/oslo-web.log 2>&1 &
          echo $! > /tmp/oslo-web.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/login >/dev/null \
              && exit 0
            sleep 2
          done
          cat /tmp/oslo-api.log /tmp/oslo-web.log
          exit 1

      - name: Gate 4 — end-to-end slices
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        run: pnpm test:e2e

      - name: Upload browser diagnostics
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/intralign/tests/e2e/test-results
            apps/intralign/tests/e2e/playwright-report
          if-no-files-found: ignore

      - name: Stop local platform
        if: always() && steps.scope.outputs.run == 'true'
        working-directory: apps/intralign
        shell: bash
        run: |
          for pid_file in /tmp/oslo-api.pid /tmp/oslo-web.pid; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          pnpm supabase stop
