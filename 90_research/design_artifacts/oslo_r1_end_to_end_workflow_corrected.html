<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OSLO Release 1 Alpha — End-to-End Product Workflow (canon-corrected)</title>
<style>
  html,body{margin:0;background:#070a0f}
  body{padding:24px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .deck{max-width:1180px;margin:0 auto}
</style>
</head>
<body>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .deck{background:#0d1117;color:#e6edf3;border-radius:14px;padding:22px 24px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
  .deckhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:1px solid #1f2733;padding-bottom:14px;margin-bottom:6px}
  .title h1{margin:0;font-size:21px;color:#fff;font-weight:800;letter-spacing:-.01em}
  .title .sub{color:#f59e0b;font-weight:700;font-size:12.5px;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
  .srcblk{text-align:right;font-size:10.5px;color:#7d8794;max-width:340px}
  .srcblk .conf{font-style:italic;margin-top:3px;color:#9aa4b2}
  .phase{display:grid;grid-template-columns:148px 1fr;gap:18px;border-top:1px solid #1b2430;padding:16px 0}
  .phase:first-of-type{border-top:none}
  .pnum .num{font-size:30px;font-weight:800;color:#f59e0b;line-height:1}
  .pnum .lbl{display:block;font-size:12px;font-weight:700;color:#cbd5e1;margin-top:5px;text-transform:uppercase;letter-spacing:.04em}
  .pbody{display:flex;flex-direction:column;gap:9px;min-width:0}
  .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:5px}
  .node{position:relative;background:#161d29;border:1px solid #2a3441;border-radius:10px;padding:8px 11px;display:flex;align-items:center;gap:8px}
  .node.acc{border-left:3px solid #f59e0b}
  .node.def{border-style:dashed;opacity:.5}
  .nic{color:#f59e0b;display:flex}
  .nl{font-size:12.5px;font-weight:650;color:#e6edf3}
  .nl em{display:block;font-style:normal;font-size:10px;opacity:.6;font-weight:500;margin-top:1px}
  .tag{position:absolute;top:-8px;right:6px;font-size:8.5px;font-weight:800;letter-spacing:.05em;background:#3a2a0a;color:#fbbf24;border:1px solid #6b4d12;border-radius:5px;padding:1px 5px}
  .chev{display:flex;align-items:center;color:#48566a}
  .note{font-size:11.5px;color:#fcd34d;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.22);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:7px;align-self:flex-start}
  .mini{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7d8794;margin-top:3px}
  .mini.dfm{color:#b08642}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:#161d29;border:1px solid #2a3441;border-radius:7px;padding:3px 9px;color:#dbe2ea}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip .cic{display:flex;color:#f59e0b}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:9px;margin-top:3px}
  .panel{background:#11161f;border:1px solid #232c38;border-radius:10px;padding:9px 11px}
  .panel.fix{border-left:3px solid #f59e0b}
  .panel h4{margin:0 0 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8b97a6;font-weight:800}
  .panel .psub{font-size:10px;color:#7d8794;margin-top:6px}
  .footer{margin-top:16px;border-top:1px solid #1b2430;padding-top:12px}
  .footer h4{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#f59e0b;font-weight:800;display:flex;align-items:center;gap:6px}
  .fixrow{font-size:11px;color:#b8c2cf;margin:3px 0;display:flex;gap:7px;align-items:flex-start}
  .fixrow iconify-icon{color:#f59e0b;margin-top:1px;flex:0 0 auto}
  .price{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px;border-radius:7px;padding:3px 10px;border:1px solid}
  .price.free{background:#161d29;border-color:#2a3441;color:#dbe2ea}
  .price.basic{background:rgba(245,158,11,.12);border-color:#a96f12;color:#fcd34d}
</style>
<h2 class="sr-only">Canon-corrected OSLO Release 1 Alpha end-to-end product workflow, in seven phases from alpha access through monetization, with deferred items and recommendation actions corrected against the canonical specs.</h2>
<div class="deck" id="deck"></div>
<script>
function ic(n,w){return `<iconify-icon icon="${n}" width="${w||18}"></iconify-icon>`}
function node(o){return `<div class="node${o.cls?' '+o.cls:''}">${o.tag?`<span class="tag">${o.tag}</span>`:''}<span class="nic">${ic(o.i,20)}</span><span class="nl">${o.l}${o.s?`<em>${o.s}</em>`:''}</span></div>`}
function flow(a){return `<div class="flow">`+a.map((n,i)=>node(n)+(i<a.length-1?`<span class="chev">${ic('lucide:chevron-right',18)}</span>`:'')).join('')+`</div>`}
function chip(o){return `<span class="chip">${o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}${o.i?`<span class="cic">${ic(o.i,14)}</span>`:''}${o.l}</span>`}
function chips(a){return `<div class="chips">`+a.map(chip).join('')+`</div>`}
function note(t){return `<div class="note">${ic('lucide:info',15)}${t}</div>`}
function phase(n,t,b){return `<div class="phase"><div class="pnum"><span class="num">${n}</span><span class="lbl">${t}</span></div><div class="pbody">${b}</div></div>`}

const head=`<div class="deckhead">
 <div class="title"><h1>OSLO — Release 1 Alpha</h1><div class="sub">End-to-End Product Workflow · canon-corrected</div></div>
 <div class="srcblk"><div>Source: OSLO_RELEASE_1_MASTER_SPEC.md §5·§6·§8·§14 · Onboarding Spec · Data Model v1.2</div>
 <div class="conf">Confidence = understanding maturity (0–100), not a health score</div></div></div>`;

const p1=phase(1,'Alpha Access & Initiation',
 flow([{i:'lucide:mail',l:'Invitation Email'},{i:'lucide:user-round-check',l:'Account Activation'},{i:'lucide:hand',l:'Welcome'},{i:'lucide:route',l:'Choose Start Method'}])
 +note('Invitation-only private alpha (§15A)'));

const p2=phase(2,'Intake — Provide Evidence',
 `<div class="mini">Release 1 — active</div>`
 +flow([{i:'lucide:upload',l:'Upload Artifacts',s:'existing docs / files',cls:'acc'},{i:'lucide:file-pen-line',l:'Describe Project',s:'free-text / paste',cls:'acc'}])
 +`<div class="mini dfm">Deferred — post-R1 (client diagram showed these as active)</div>`
 +flow([{i:'lucide:layout-template',l:'Start From Template',s:'no catalog yet',cls:'def',tag:'DEFERRED'},{i:'lucide:list-todo',l:'Guided Intake',s:'flow undefined',cls:'def',tag:'DEFERRED'}]));

const p3=phase(3,'Fast Pass — Understand in 60s',
 note('≈ 60 seconds — creates an initial working planning model')
 +flow([{i:'lucide:scan-text',l:'Extract',cls:'acc'},{i:'lucide:git-branch',l:'Infer',cls:'acc'},{i:'lucide:blocks',l:'Construct',cls:'acc'},{i:'lucide:gauge',l:'Evaluate',cls:'acc'}])
 +`<div class="mini">Fast Pass outputs</div>`
 +chips([{i:'lucide:badge-check',l:'Orientation Confidence'},{i:'lucide:layout-dashboard',l:'Initial MRI'},{i:'lucide:triangle-alert',l:'Top Issues'},{i:'lucide:circle-help',l:'Clarification Requests'},{i:'lucide:wrench',l:'Suggested Fixes'},{i:'lucide:activity',l:'Analysis Status'}])
 +flow([{i:'lucide:panel-top',l:'Project Overview / MRI',s:'understanding presented'},{i:'lucide:pen-line',l:'Artifact Workspace',s:'read & improve'}]));

const p4=phase(4,'Deep Pass — Initial Build',
 note('Initial Intake Mode · highest-compute phase  (Deep Pass also runs in an Event-Driven mode)')
 +chips([{i:'lucide:layers',l:'Build understanding'},{i:'lucide:check-check',l:'Validate findings'},{i:'lucide:badge-check',l:'Mature confidence'},{i:'lucide:layout-dashboard',l:'Mature MRI'},{i:'lucide:lightbulb',l:'Generate recommendations'}]));

const loop=flow([{i:'lucide:files',l:'Artifacts'},{i:'lucide:microscope',l:'Analysis'},{i:'lucide:badge-check',l:'Confidence'},{i:'lucide:triangle-alert',l:'Issues'},{i:'lucide:lightbulb',l:'Recommendations'},{i:'lucide:mouse-pointer-click',l:'User Action'},{i:'lucide:file-pen',l:'Artifact Improvement'},{i:'lucide:trending-up',l:'Confidence Improvement'}]);
const p5panels=`<div class="panels">
 <div class="panel"><h4>Issue severity → CAF</h4>${chips([{dot:'#f87171',l:'Critical'},{dot:'#fbbf24',l:'Moderate'},{dot:'#60a5fa',l:'Warning'}])}<div class="psub">every issue maps to CAF: Clarity · Alignment · Feasibility</div></div>
 <div class="panel fix"><h4>Recommendation actions ·  corrected</h4>${chips([{i:'lucide:check',l:'Accept'},{i:'lucide:clock',l:'Defer'},{i:'lucide:x',l:'Reject'},{i:'lucide:wand-sparkles',l:'Apply'}])}<div class="psub">+ added Defer · removed Modify (canonical lifecycle states)</div></div>
 <div class="panel fix"><h4>Collaboration affordances</h4>${chips([{i:'lucide:message-circle',l:'Discuss / Comment'},{i:'lucide:share-2',l:'Share for Review'}])}<div class="psub">not recommendation states — moved out of the action set</div></div>
 <div class="panel fix"><h4>Always-available surfaces ·  renamed</h4>${chips([{i:'lucide:layers-2',l:'Overlay'},{i:'lucide:message-square',l:'OSLO Chat'},{i:'lucide:layout-dashboard',l:'MRI'}])}<div class="psub">was "CAF Overlay" / "Project MRI"</div></div>
</div>`;
const p5=phase(5,'Core Improvement Loop',
 note('event-driven · no change → no reanalysis')
 +loop
 +`<div class="mini">↺ Confidence Improvement feeds back to Artifacts</div>`
 +p5panels);

const p6=phase(6,'Collaboration & CAF Review',
 flow([{i:'lucide:share-2',l:'Share / CAF Review Request',s:'MRI · artifact · project'},{i:'lucide:users',l:'Stakeholder Response',s:'comment · approve · reject · suggest alt'},{i:'lucide:brain',l:'Deep Pass Evaluates',s:'response = evidence'},{i:'lucide:refresh-cw',l:'Confidence & MRI Update'}]));

const p7=phase(7,'Monetization (Free Tier)',
 flow([{i:'lucide:zap',l:'Daily Fix Usage',s:'free tier applies fixes'},{i:'lucide:ban',l:'Daily Limit Reached'},{i:'lucide:circle-arrow-up',l:'Upgrade Prompt',s:'contextual'}])
 +`<div class="chips" style="margin-top:4px"><span class="price free">${ic('lucide:circle-dollar-sign',14)} Free · $0</span><span class="price basic">${ic('lucide:circle-check',14)} Basic · $12 / mo · ratified 2026-06-05</span></div>`);

const footer=`<div class="footer"><h4>${ic('lucide:wrench',13)} Canon corrections applied vs the client diagram</h4>
 <div class="fixrow">${ic('lucide:triangle-alert',14)}<span><b>Intake:</b> "Start From Template" & "Guided Intake" marked <b>deferred</b> — R1 ships Upload + Describe only (Onboarding Spec, 2026-05-31).</span></div>
 <div class="fixrow">${ic('lucide:triangle-alert',14)}<span><b>Recommendation actions:</b> now Accept · Defer · Reject · Apply; "Modify"/"Discuss" removed; Discuss & Share for Review shown as collaboration, not rec states (Data Model v1.2 §12).</span></div>
 <div class="fixrow">${ic('lucide:triangle-alert',14)}<span><b>Naming:</b> Overlay (not "CAF Overlay") · MRI (not "Project MRI") · Upgrade Prompt (not "Contextual…") · dropped "MRI Reveal".</span></div>
 <div class="fixrow">${ic('lucide:check',14)}<span><b>Kept (verified canon):</b> source citation, Fast verbs, 60s + planning model, severity→CAF, confidence-as-maturity, CRR seam, and the $12 price.</span></div></div>`;

document.getElementById('deck').innerHTML=head+p1+p2+p3+p4+p5+p6+p7+footer;
</script>
</body>
</html>
