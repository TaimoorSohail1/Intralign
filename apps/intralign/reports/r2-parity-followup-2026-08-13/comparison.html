<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R2 parity follow-up evidence</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #080b0f; color: #eef0f2; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    h2 { margin: 28px 0 12px; color: #a9c4e6; font-size: 16px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #2b343e; border-radius: 12px; background: #0b0f13; }
    figcaption { padding: 10px 12px; border-bottom: 1px solid #2b343e; color: #9aa6b4; font-size: 12px; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>R2 prototype vs app — current-run evidence</h1>
  <h2>Overview workspace and sidebar</h2>
  <div class="pair">
    <figure><figcaption>Prototype reference</figcaption><img src="screenshots/prototype-overview-reference.png" alt="Prototype Overview"></figure>
    <figure><figcaption>App after fix</figcaption><img src="screenshots/app-overview-banner-open.png" alt="App Overview"></figure>
  </div>
  <h2>Returning-client watch-it-work analysis</h2>
  <div class="pair">
    <figure><figcaption>Prototype</figcaption><img src="screenshots/prototype-returning-watch.png" alt="Prototype returning analysis"></figure>
    <figure><figcaption>App after fix</figcaption><img src="screenshots/app-returning-watch.png" alt="App returning analysis"></figure>
  </div>
</body>
</html>
