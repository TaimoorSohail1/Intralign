<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Update now placement proposal</title>
  <desc id="desc">Desktop and mobile mockups place Update now beside the current read timestamp and disclose that it runs one Deep Pass analysis with no monthly cap.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2227"/>
      <stop offset="1" stop-color="#151a1e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0d1012"/>
  <text x="92" y="76" fill="#f5f4f0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Update now · placement proposal</text>
  <text x="92" y="114" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="18">Primary control lives with the current project read; capacity cost is disclosed where the user acts.</text>

  <!-- Desktop -->
  <text x="92" y="174" fill="#d97a3a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DESKTOP</text>
  <g filter="url(#shadow)">
    <rect x="92" y="196" width="1416" height="420" rx="20" fill="url(#panel)" stroke="#37414a"/>
  </g>
  <text x="132" y="246" fill="#7892a6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">OUTCOME INTEGRITY</text>
  <text x="132" y="302" fill="#f5f4f0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Fragile</text>
  <text x="132" y="338" fill="#b3bec5" font-family="Inter, Arial, sans-serif" font-size="18">limited by</text>
  <text x="225" y="338" fill="#53cba5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Grounding</text>
  <text x="330" y="338" fill="#b3bec5" font-family="Inter, Arial, sans-serif" font-size="18">— a composite is only as sound as its weakest pillar</text>

  <rect x="132" y="382" width="1336" height="1" fill="#303941"/>
  <text x="132" y="426" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="16">as of [analysis date] · live tracking begins at execution</text>

  <g>
    <rect x="132" y="454" width="1336" height="112" rx="14" fill="#12171a" stroke="#3a464e"/>
    <circle cx="166" cy="488" r="8" fill="#d97a3a"/>
    <text x="188" y="495" fill="#f5f4f0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Refresh the current read</text>
    <text x="188" y="528" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="15">Runs a new Deep Pass · counts as 1 analysis · no monthly cap</text>
    <rect x="1280" y="474" width="158" height="56" rx="10" fill="#d97a3a"/>
    <text x="1359" y="509" text-anchor="middle" fill="#111315" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Update now</text>
  </g>
  <path d="M1360 445 L1360 428 L1014 428" fill="none" stroke="#d97a3a" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="1008" y="432" text-anchor="end" fill="#d97a3a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">PRIMARY ACTION BESIDE CURRENT READ</text>

  <!-- Mobile -->
  <text x="92" y="684" fill="#d97a3a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">MOBILE</text>
  <g filter="url(#shadow)">
    <rect x="92" y="706" width="520" height="238" rx="20" fill="url(#panel)" stroke="#37414a"/>
  </g>
  <text x="124" y="750" fill="#7892a6" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CURRENT READ · FRAGILE</text>
  <text x="124" y="785" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="14">as of [analysis date]</text>
  <text x="124" y="824" fill="#f5f4f0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Refresh the current read</text>
  <text x="124" y="851" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="13">1 Deep Pass · counts as 1 analysis · no monthly cap</text>
  <rect x="124" y="874" width="456" height="48" rx="9" fill="#d97a3a"/>
  <text x="352" y="905" text-anchor="middle" fill="#111315" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Update now</text>

  <g>
    <rect x="670" y="726" width="838" height="188" rx="16" fill="#151a1e" stroke="#303941"/>
    <text x="704" y="770" fill="#f5f4f0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Copy follows returned capacity data</text>
    <text x="704" y="809" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="16">Uncapped now: counts as 1 analysis · no monthly cap</text>
    <text x="704" y="842" fill="#91a0aa" font-family="Inter, Arial, sans-serif" font-size="16">Capped later: uses 1 of {remaining} remaining this month</text>
    <text x="704" y="875" fill="#53cba5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">No invented allowance number · no billing navigation required</text>
  </g>
</svg>
